name: Bull Call Spread Scheduler

on:
  schedule:
    - cron: '45 3 * * 1-5'   # 9:15 AM IST = 3:45 AM UTC, Mon-Fri
  workflow_dispatch:

jobs:
  run-bull-call-spread:
    runs-on: ubuntu-latest
    timeout-minutes: 390   # 9:15 AM IST start → 3:30 PM IST close = 6h 15min; 390 gives safe buffer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run bull call spread strategy
        working-directory: backend
        env:
          TZ: Asia/Kolkata
        run: |
          python -m bullcallspread.nifty_bull_call_signal
