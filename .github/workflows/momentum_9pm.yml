name: Update Momentum Excel Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"   # 9:00 PM IST = 15:30 UTC

permissions:
  contents: write

jobs:
  update-momentum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: user_profile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run momentum update
        run: python backend/update_momentum_sheet.py

      - name: Commit momentum outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/
          git diff --cached --quiet || git commit -m "Daily momentum update"
          git push origin user_profile
