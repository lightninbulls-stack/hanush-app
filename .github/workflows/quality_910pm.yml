name: Update Quality 9:10pm

on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * 1-5'   # 9:10 PM IST = 3:40 PM UTC, Monday-Friday

permissions:
  contents: write

jobs:
  update-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: user_profile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Update quality CSV
        run: python backend/quality/update_quality_sheet.py

      - name: Commit updated quality CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/quality_latest.csv
          git diff --cached --quiet || git commit -m "Automated quality update"

      - name: Push changes
        run: git push origin HEAD:user_profile
