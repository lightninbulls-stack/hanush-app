name: Update Quality 9:10pm

on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * 1-5'   # 9:10 PM IST = 3:40 PM UTC, Mon-Fri

permissions:
  contents: write

concurrency:
  group: data-update-user-profile
  cancel-in-progress: false

jobs:
  update-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: user_profile
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Update quality CSV
        run: python backend/quality/update_quality_sheet.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/quality_latest.csv
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Automated quality update"
          git pull --rebase origin user_profile
          git push origin HEAD:user_profile
