name: Downside Stock Signal Scheduler

on:
  schedule:
    # 9:25 AM IST = 3:55 AM UTC
    - cron: "55 3 * * 1-5"
  workflow_dispatch:

jobs:
  trigger-downside-stock-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render downside stock signal
        run: |
          echo "Triggering Downside Stock Signal at $(date)"
          curl -X POST "https://hanush-backend-service1.onrender.com/api/downside-stock-signal-strategy/start"
