name: Update low vol 9:05pm

on:
  workflow_dispatch:
  schedule:
    - cron: '35 15 * * 1-5'   # 9:05 PM IST = 3:35 PM UTC, Monday-Friday

permissions:
  contents: write

jobs:
  update-low-vol:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: user_profile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Update low vol CSV
        run: python backend/low_vol/update_low_vol_sheet.py

      - name: Commit updated low vol CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/low_vol_latest.csv
          git diff --cached --quiet || git commit -m "Automated low vol update"

      - name: Push changes
        run: git push origin HEAD:user_profile
