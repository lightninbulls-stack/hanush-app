name: Update regime 9:10pm

on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * 1-5'   # 9:10 PM IST = 3:40 PM UTC, Monday-Friday

permissions:
  contents: write

jobs:
  update-regime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: user_profile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Update regime CSVs
        run: python backend/regime/update_regime_sheets.py

      - name: Commit updated regime CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/regime_snapshot.csv
          git add backend/data/regime_upside_latest.csv
          git add backend/data/regime_downside_latest.csv
          git diff --cached --quiet || git commit -m "Automated regime update"

      - name: Push changes
        run: git push origin HEAD:user_profile
