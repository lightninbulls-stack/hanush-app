name: Bull Call Spread SENSEX Scheduler

on:
  schedule:
    - cron: '48 3 * * 1-5'   # 9:18 AM IST = 3:48 AM UTC, Mon-Fri
  workflow_dispatch:

jobs:
  run-bull-call-sensex-spread:
    runs-on: ubuntu-latest
    timeout-minutes: 390   # 9:18 AM IST start → 3:30 PM IST close = 6h 12min; 390 gives safe buffer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run SENSEX bull call spread strategy
        working-directory: backend
        env:
          TZ: Asia/Kolkata
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Starting SENSEX Bull Call Strategy at $(date)"
          python -u -m bullcallspread.sensex_bull_call_signal
