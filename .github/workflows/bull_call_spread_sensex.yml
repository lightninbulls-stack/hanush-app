name: Bull Call Spread SENSEX Scheduler

on:
  schedule:
    - cron: '18 9 * * 1-5'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

jobs:
  run-bull-call-sensex-spread:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run SENSEX bull call spread strategy
        working-directory: backend
        env:
          TZ: Asia/Kolkata
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Starting SENSEX Bull Call Strategy at $(date)"
          python -u -m bullcallspread.sensex_bull_call_signal
