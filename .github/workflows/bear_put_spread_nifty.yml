name: Bear Put Spread Scheduler

on:
  schedule:
    - cron: '55 3 * * 1-5'   # 9:25 AM IST = 3:55 AM UTC, Mon-Fri
  workflow_dispatch:

jobs:
  run-bear-put-spread:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run bear put spread strategy
        working-directory: backend
        env:
          TZ: Asia/Kolkata
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Starting Bear Put Strategy at $(date)"
          python -u -m bearputspread.nifty_bear_put_signal
