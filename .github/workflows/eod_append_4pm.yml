name: EOD Append Close Prices Daily 4pm

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'   # 4:00 PM IST = 10:30 UTC, Mon-Fri

permissions:
  contents: write

concurrency:
  group: data-update-user-profile
  cancel-in-progress: false

jobs:
  append-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: user_profile
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run EOD appender
        run: python backend/fetch_service/append_latest_eod.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/close_prices_wide.csv
          git add backend/data/logs/daily_update_failed_tickers.csv || true
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Daily EOD append update"
          git pull --rebase origin user_profile
          git push origin HEAD:user_profile
