name: EOD Append Close Prices Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"   # 4:00 PM IST = 10:30 UTC

permissions:
  contents: write

jobs:
  append-eod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: user_profile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run EOD appender
        run: python backend/fetch_service/append_latest_eod.py

      - name: Commit updated close price file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/close_prices_wide.csv
          git add backend/data/logs/daily_update_failed_tickers.csv || true
          git diff --cached --quiet || git commit -m "Daily EOD append update"
          git push origin user_profile
