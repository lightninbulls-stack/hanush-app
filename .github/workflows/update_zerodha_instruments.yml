name: Update Zerodha Instruments CSV

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1-5'   # 6:00 AM IST = 00:30 UTC, Mon-Fri

permissions:
  contents: write

concurrency:
  group: data-update-user-profile
  cancel-in-progress: false

jobs:
  update-instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: user_profile
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Zerodha instruments updater
        run: python backend/scripts/update_zerodha_instruments.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/inst_zerodha_nfo.csv
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Auto-update Zerodha instruments CSV"
          git pull --rebase origin user_profile
          git push origin HEAD:user_profile
