name: Update Zerodha Instruments CSV

on:
  schedule:
    # 6:00 AM IST = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-instruments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Zerodha instruments updater
        run: python backend/scripts/update_zerodha_instruments.py

      - name: Commit and push if file changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/inst_zerodha_nfo.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update Zerodha instruments CSV"
            git push
          fi
