name: Bear Put Spread SENSEX Scheduler

on:
  schedule:
    - cron: '25 9 * * 1-5'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

jobs:
  run-bear-put-sensex-spread:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run SENSEX bear put spread strategy
        working-directory: backend
        env:
          TZ: Asia/Kolkata
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Starting SENSEX Bear Put Strategy at $(date)"
          python -u -m bearputspread.sensex_bear_put_signal
