name: Upside Stock Signal Scheduler

on:
  schedule:
    # 9:20 AM IST = 3:50 AM UTC
    - cron: "50 3 * * 1-5"
  workflow_dispatch:

jobs:
  trigger-upside-stock-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render upside stock signal
        run: |
          echo "Triggering Upside Stock Signal at $(date)"
          curl -X POST "https://hanush-backend-service1.onrender.com/api/upside-stock-signal-strategy/start"
